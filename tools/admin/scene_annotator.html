<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silksong Map Scene Annotator (Phase 5)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121225;
            color: #fff;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        .map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: crosshair;
            background: #090915;
        }

        #map-wrapper {
            position: absolute;
            transform-origin: 0 0;
        }

        #labeled-map {
            display: block;
            max-width: none;
        }

        .pin-marker {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #fff;
            pointer-events: none;
        }

        .pin-marker.ocr {
            background: #ffc107;
        }

        .pin-marker.manual {
            background: #00bcd4;
        }

        .pin-marker.confirmed {
            background: #4caf50;
        }

        /* Sidebar */
        .sidebar {
            width: 360px;
            background: #1a1a36;
            border-left: 2px solid #2a2a4e;
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        .sidebar h2 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .search-box {
            width: 100%;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #252548;
            color: #fff;
            margin-bottom: 12px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            background: #e94560;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #ff527b;
        }

        .btn-secondary {
            background: #3a3a60;
        }

        .btn-secondary:hover {
            background: #4a4a75;
        }

        .scene-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #2a2a4e;
            border-radius: 6px;
            background: #14142b;
        }

        .scene-item {
            padding: 10px;
            border-bottom: 1px solid #222244;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .scene-item:hover {
            background: #25254d;
        }

        .scene-item.active {
            background: #e94560;

        }

        .scene-status {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background: #333;
        }

        .status-unplaced {
            background: #f44336;
        }

        .status-placed {
            background: #00bcd4;
        }

        /* Controls */
        .zoom-controls {
            position: fixed;
            bottom: 20px;
            right: 380px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 50%;
            background: #2a2a4e;
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Map Canvas -->
        <div class="map-container" id="map-container">
            <div id="map-wrapper">
                <img id="labeled-map" src="assets/img/fullmap/silksong_fullmap.png" alt="Labeled Map">
                <div id="marker-container"></div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <h2>🎯 Scene Annotator</h2>
            <p style="font-size: 0.8rem; color: #aaa; margin-bottom: 10px;">
                Select a scene below, then click its location on the map.
            </p>

            <input type="text" class="search-box" id="search-box" placeholder="Search missing scenes...">

            <div class="actions">
                <button class="btn" id="export-btn">💾 Export JSON</button>
                <button class="btn btn-secondary" id="clear-btn">Clear Selection</button>
            </div>

            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; margin-bottom: 12px; cursor: pointer;">
                <input type="checkbox" id="show-existing-toggle" checked> Show Existing Mapped Tiles (Reference)
            </label>

            <div class="scene-list" id="scene-list"></div>
        </div>
    </div>

    <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in">+</button>
        <button class="zoom-btn" id="zoom-out">−</button>
    </div>

    <script>
        let transformMatrix = null;
        let scale = 0.5;
        let panX = 0, panY = 0;
        let isDragging = false;
        let startX, startY;
        let selectedScene = null;
        let annotations = {};

        const mapContainer = document.getElementById('map-container');
        const mapWrapper = document.getElementById('map-wrapper');
        const labeledMap = document.getElementById('labeled-map');
        const markerContainer = document.getElementById('marker-container');
        const sceneList = document.getElementById('scene-list');

        async function init() {
            try {
                // Load map transform matrix
                const res = await fetch('assets/img/fullmap/map_transform.json');
                if (res.ok) {
                    transformMatrix = await res.json();
                }
            } catch (e) { console.warn("No transform matrix found yet."); }

            setupEvents();
            loadSampleScenes();
            updateTransform();
        }

        let existingTilesData = {};

        async function loadSampleScenes() {
            // Load saved annotations from localStorage
            const saved = localStorage.getItem('silksong_manual_annotations');
            if (saved) {
                annotations = JSON.parse(saved);
            }

            try {
                const res = await fetch('assets/img/fullmap/tile_coordinates.json');
                if (res.ok) {
                    const data = await res.json();
                    existingTilesData = data.tiles || {};
                    const unconfirmed = [];
                    for (const [name, tile] of Object.entries(existingTilesData)) {
                        if (!tile.confirmed) {
                            unconfirmed.push(name.replace('.png', ''));
                        }
                    }
                    if (unconfirmed.length > 0) {
                        unconfirmed.sort();
                        window.missingScenesList = unconfirmed;
                    }
                }
            } catch (e) { console.warn("Failed to load tile_coordinates.json", e); }

            renderSceneList();
            renderMarkers();
        }

        function renderMarkers() {
            markerContainer.innerHTML = '';
            const showExisting = document.getElementById('show-existing-toggle')?.checked ?? true;

            // Render existing mapped tiles from tile_coordinates.json
            if (showExisting && transformMatrix && transformMatrix.clean_to_labeled) {
                const M_inv = transformMatrix.clean_to_labeled;
                for (const [name, tile] of Object.entries(existingTilesData)) {
                    const cleanX = tile.x + tile.width / 2.0;
                    const cleanY = tile.y + tile.height / 2.0;
                    const lx = M_inv[0][0] * cleanX + M_inv[0][1] * cleanY + M_inv[0][2];
                    const ly = M_inv[1][0] * cleanX + M_inv[1][1] * cleanY + M_inv[1][2];

                    const pin = document.createElement('div');
                    pin.className = `pin-marker ${tile.confirmed ? 'confirmed' : 'ocr'}`;
                    pin.style.left = `${lx}px`;
                    pin.style.top = `${ly}px`;
                    pin.title = `${name} (${tile.confirmed ? 'Confirmed' : 'OCR/OpenCV Match'})`;
                    markerContainer.appendChild(pin);
                }
            }

            // Render manual annotations
            for (const [scene, data] of Object.entries(annotations)) {
                const pin = document.createElement('div');
                pin.className = 'pin-marker manual';
                pin.style.left = `${data.labeled_x}px`;
                pin.style.top = `${data.labeled_y}px`;
                pin.title = `${scene} (Manual Annotation)`;
                markerContainer.appendChild(pin);
            }
        }

        function renderSceneList(filter = '') {
            sceneList.innerHTML = '';
            const scenes = window.missingScenesList || ['Abyss_02b_top', 'Ant_02b', 'Aqueduct_02_right', 'Arborium_04', 'Bellway_01', 'Bone_East_03_right', 'Clover_01b', 'Coral_29', 'Dock_03', 'Dust_Maze_01', 'Greymoor_05', 'Library_01_bot', 'Peak_01_top', 'Shadow_03', 'Shellwood_03', 'Slab_01', 'Song_02', 'Under_01_bot', 'Ward_01'];

            const filtered = scenes.filter(s => s.toLowerCase().includes(filter.toLowerCase()));

            filtered.forEach(scene => {
                const item = document.createElement('div');
                item.className = `scene-item ${selectedScene === scene ? 'active' : ''}`;
                const isPlaced = annotations[scene] !== undefined;

                item.innerHTML = `
                    <span>${scene}</span>
                    <span class="scene-status ${isPlaced ? 'status-placed' : 'status-unplaced'}">
                        ${isPlaced ? 'Placed' : 'Missing'}
                    </span>
                `;

                item.addEventListener('click', () => {
                    selectedScene = scene;
                    renderSceneList(filter);
                });

                sceneList.appendChild(item);
            });
        }

        function setupEvents() {
            // Map click
            labeledMap.addEventListener('click', (e) => {
                if (!selectedScene) return;

                const rect = labeledMap.getBoundingClientRect();
                const clickX = (e.clientX - rect.left) / scale;
                const clickY = (e.clientY - rect.top) / scale;

                // Transform to clean map coords if matrix exists
                let cleanX = clickX, cleanY = clickY;
                if (transformMatrix && transformMatrix.labeled_to_clean) {
                    const M = transformMatrix.labeled_to_clean;
                    cleanX = M[0][0] * clickX + M[0][1] * clickY + M[0][2];
                    cleanY = M[1][0] * clickX + M[1][1] * clickY + M[1][2];
                }

                annotations[selectedScene] = {
                    labeled_x: Math.round(clickX),
                    labeled_y: Math.round(clickY),
                    clean_x: Math.round(cleanX),
                    clean_y: Math.round(cleanY)
                };

                localStorage.setItem('silksong_manual_annotations', JSON.stringify(annotations));
                renderMarkers();
                renderSceneList();
            });

            // Pan & Zoom
            mapContainer.addEventListener('mousedown', (e) => {
                if (e.button !== 0) return;
                isDragging = true;
                startX = e.clientX - panX;
                startY = e.clientY - panY;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                panX = e.clientX - startX;
                panY = e.clientY - startY;
                updateTransform();
            });

            document.addEventListener('mouseup', () => { isDragging = false; });

            document.getElementById('zoom-in').addEventListener('click', () => { scale *= 1.2; updateTransform(); });
            document.getElementById('zoom-out').addEventListener('click', () => { scale *= 0.8; updateTransform(); });

            document.getElementById('export-btn').addEventListener('click', exportAnnotations);
            document.getElementById('search-box').addEventListener('input', (e) => renderSceneList(e.target.value));
            document.getElementById('show-existing-toggle')?.addEventListener('change', renderMarkers);
        }

        function renderMarkers() {
            markerContainer.innerHTML = '';
            for (const [scene, data] of Object.entries(annotations)) {
                const pin = document.createElement('div');
                pin.className = 'pin-marker manual';
                pin.style.left = `${data.labeled_x}px`;
                pin.style.top = `${data.labeled_y}px`;
                pin.title = scene;
                markerContainer.appendChild(pin);
            }
        }

        function updateTransform() {
            mapWrapper.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        }

        function exportAnnotations() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({
                metadata: { exported_at: new Date().toISOString(), total: Object.keys(annotations).length },
                tiles: annotations
            }, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "manual_annotations.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
