name: Deploy to GitHub Pages

# Deploy only after the CI workflow has passed on main. A red test run never
# publishes. Manual runs (workflow_dispatch) remain available for re-deploys.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Build job
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy exactly the commit CI tested, not whatever main is now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM
        run: wasm-pack build wasm-crypto --target web --out-dir ../web/pkg

      - name: Stamp build
        run: |
          printf '{"sha":"%s","date":"%s"}\n' "$(git rev-parse HEAD)" "$(git log -1 --format=%cs)" > web/version.json
          cat web/version.json

      # The #dev page (save keys no pack reads) is for local hosting only:
      # main.js offers it only on localhost / LAN, and its code is not published
      # Fixtures are trimmed copies of real saves and the goldens are rendered
      # from them; the app never loads either, so they stay out of the site
      - name: Leave out the local-only dev page and test data
        run: rm -rf web/src/dev web/src/data/__fixtures__ web/src/__snapshots__

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
